<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>第五章 Graph-RAG 问答</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <aside>
      <div class="brand">Chapter 5 RAG</div>
      <div class="sub">船体分段的装配</div>
      <div class="status" id="status">检查中...</div>
    </aside>
    <main>
      <section class="ask-panel">
        <label>QUESTION</label>
        <textarea id="question">分段装配方式有哪些？各自适用于什么情况？</textarea>
        <div class="controls">
          <div><span>Top K</span><input id="topK" type="number" min="1" max="10" value="5" /></div>
          <div><span>Graph Hops</span><input id="hops" type="number" min="1" max="2" value="1" /></div>
          <button id="askBtn">生成答案</button>
        </div>
      </section>
      <section class="answer-panel">
        <div class="panel-title">ANSWER <span id="badge">待生成</span></div>
        <pre id="answer">输入问题后生成答案。</pre>
      </section>
      <section class="trace">
        <div>
          <h3>LINKED ENTITIES</h3>
          <div id="entities"></div>
        </div>
        <div>
          <h3>GRAPH EVIDENCE</h3>
          <div id="graph"></div>
        </div>
        <div>
          <h3>DOCUMENT EVIDENCE</h3>
          <div id="docs"></div>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
